version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom"]
      dev-tooling:
        dependency-type: development
    ignore:
      # TypeScript 7은 tsserver를 포함하지 않아 next 플러그인·에디터 연동이 깨짐
      - dependency-name: "typescript"
        versions: [">=7"]
      # 런타임(.nvmrc, engines)이 Node 24이므로 타입도 24.x에 맞춤
      - dependency-name: "@types/node"
        versions: [">=25"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
