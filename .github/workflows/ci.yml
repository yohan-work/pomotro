name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Simulation · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:sim
      - run: npm run build

  browser:
    name: Browser verification (Chrome)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start server
        run: |
          npm start -- -p 3123 &
          for i in $(seq 1 30); do curl -sf http://localhost:3123 > /dev/null && break; sleep 1; done
      - run: npm run verify:behavior -- http://localhost:3123 --pwa
      - run: npm run verify:browser -- http://localhost:3123
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: .verify/
          retention-days: 7

  visual:
    name: Visual diff (base vs PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build PR
        run: npm ci && npm run build
      - name: Build base branch
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          cd ../base && npm ci && npm run build
      - name: Start both servers
        run: |
          npm start -- -p 3123 &
          (cd ../base && npm start -- -p 3124 &)
          for i in $(seq 1 40); do curl -sf http://localhost:3123 >/dev/null && curl -sf http://localhost:3124 >/dev/null && break; sleep 1; done
      - name: Compare scenes
        run: node scripts/visual-diff.mjs http://localhost:3124 http://localhost:3123 --out .verify/visual
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-diff
          path: .verify/visual/
          retention-days: 14
