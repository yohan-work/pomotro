name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Simulation · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:sim
      - run: npm run build

  browser:
    name: Browser verification (Chrome)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start server
        run: |
          npm start -- -p 3123 &
          for i in $(seq 1 30); do curl -sf http://localhost:3123 > /dev/null && break; sleep 1; done
      - run: npm run verify:behavior -- http://localhost:3123
      - run: npm run verify:browser -- http://localhost:3123
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: .verify/
          retention-days: 7
